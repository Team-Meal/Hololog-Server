spring.application.name=hororog

# AI Server (테스트용 더미 URL)
ai.server.url=http://localhost:8081

# 테스트용 H2 임베디드 DB
spring.datasource.url=jdbc:h2:mem:hororog;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# JWT (테스트용 기본값)
jwt.secret=test-secret-key-for-hororog-must-be-at-least-32-bytes-long
jwt.access-expiration=1800000
jwt.refresh-expiration=1209600000

# Redis (테스트용 기본값 — 컨텍스트 로딩 시 실제 연결하지 않음)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# CORS (테스트용 기본값)
cors.allowed-origins=http://localhost:3000
