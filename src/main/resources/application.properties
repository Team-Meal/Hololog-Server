spring.application.name=hororog

# AI Server
ai.server.url=${AI_SERVER_URL:http://localhost:8081}
# AI 서버가 LLM 호출을 포함해 식단을 생성하는 데 수분이 걸릴 수 있어 read-timeout을 넉넉히 둔다.
spring.cloud.openfeign.client.config.ai-server.connectTimeout=5000
spring.cloud.openfeign.client.config.ai-server.readTimeout=300000

# DB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# JWT
# secret은 32바이트(HS256) 이상이어야 하며 반드시 환경변수로 주입한다.
# 기본값을 두지 않는다 — 미설정 시 부팅이 실패해야 약한 키로 운영되는 사고를 막을 수 있다.
jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:1800000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:1209600000}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# CORS
# 쉼표로 여러 origin 지정 가능 (예: http://a.com,http://b.com)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Internal API
# AI 서버 → 앱 서버 콜백 인증에 사용하는 공유 키. 반드시 환경변수로 주입한다.
internal.api-key=${INTERNAL_API_KEY:dev-internal-key}

# KAMIS (농산물유통정보)
kamis.url=https://www.kamis.or.kr
kamis.api-key=${KAMIS_API_KEY}
# p_cert_id: KAMIS API 신청 시 발급된 인증 ID (숫자 또는 이메일)
kamis.cert-id=${KAMIS_CERT_ID}
spring.cloud.openfeign.client.config.kamis.connectTimeout=5000
spring.cloud.openfeign.client.config.kamis.readTimeout=10000
# KAMIS API 키가 URL 쿼리스트링에 포함되므로 Feign DEBUG 로그 비활성화
logging.level.org.springframework.cloud.openfeign=WARN
