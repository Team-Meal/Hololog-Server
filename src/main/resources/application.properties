spring.application.name=hororog

# JWT
# secret은 32바이트(HS256) 이상이어야 하며 운영에서는 환경변수로 주입한다.
jwt.secret=${JWT_SECRET:local-development-secret-key-please-change-me-32bytes}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:1800000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:1209600000}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
